name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Xlient
          outputs: |
            dist/snake.svg?color_snake=#FF2A6D&color_dots=#ebedf0,#c8f7ff,#7ff3ff,#00d0e0,#00a0b0
            dist/snake-dark.svg?color_snake=#FF2A6D&color_dots=#1a0b2e,#3d0a5b,#7a1fa2,#c13bd1,#00F0FF&color_background=#0D0221

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
